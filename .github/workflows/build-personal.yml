name: Compilación Personal (beta)

on:
  push:
    branches:
      - beta
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - "fastlane/"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:   # Permite lanzarlo manualmente desde la UI

jobs:
  build:
    name: Compilar APK (Release sin firmar)
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repositorio con submódulos (necesario para media3)
      - name: Checkout del código y submódulos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Configurar JDK 21 (requerido por Gramophone)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Crear archivo package.properties (necesario para compilar)
      - name: Establecer tipo de compilación
        run: echo "releaseType=PersonalBuild" > package.properties

      # 4. Dar permisos de ejecución a gradlew
      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # 5. Compilar APK en modo Release (sin firmar)
      - name: Compilar APK Release
        run: ./gradlew :app:assembleRelease

      # 6. Encontrar y nombrar el APK generado
      - name: Obtener nombre del APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK_PATH .apk)" >> $GITHUB_OUTPUT

      # 7. Subir el APK como artefacto (descargable desde Actions)
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          compression-level: 0   # Sin comprimir, descarga directa del APK
